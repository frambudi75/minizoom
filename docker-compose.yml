services:
  backend:
    build: ./backend
    container_name: minizoom_backend
    ports:
      - "8000:8000" # Aman dari port terlarang
    environment:
      - DATABASE_URL=sqlite:///./data/minizoom.db
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://localhost:7880}
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@minizoom.local}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./backend:/app
      - minizoom_data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: minizoom_frontend
    ports:
      - "3000:3000" # Aman dari port terlarang
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_LIVEKIT_URL=${LIVEKIT_URL:-ws://localhost:7880}
    depends_on:
      - backend
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    container_name: minizoom_livekit
    command: ["--dev", "--keys", "devkey: secret"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

volumes:
  minizoom_data:
