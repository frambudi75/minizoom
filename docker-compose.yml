version: '3.8'

services:
  backend:
    build: ./backend
    container_name: minizoom_backend
    ports:
      - "8000:8000" # Aman dari port terlarang
    environment:
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - LIVEKIT_URL=ws://host.docker.internal:7880
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: minizoom_frontend
    ports:
      - "3000:3000" # Aman dari port terlarang
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    container_name: minizoom_livekit
    command: --dev --keys devkey:secret
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped
